<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pixiv</title>
  <style>
    body {
      font-family: monospace, sans-serif;
      background: #eeeeee;
      color: #000000;
      margin: 2rem;
    }
    .section {
      margin-top: 1.5rem;
    }
    .section p {
      margin: 0.5rem 0;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      cursor: pointer;
    }
    button:hover {
      background: #0000ff;
      color: #ffffff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }
    select {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
    }
    a {
      color: #0000ee;
    }
  </style>
</head>
<body>
  <h1>Random Pixiv</h1>

  <div class="section" data-type="illust">
    <h2>イラスト (Artwork)</h2>
    <p>1〜<span class="max"></span> の中からランダムな作品IDへ移動します。</p>
    <p>
      <label>
        年齢制限：
        <select class="age-filter">
          <option value="all">全て表示</option>
          <option value="general">全年齢のみ</option>
          <option value="r18">R-18のみ</option>
        </select>
      </label>
    </p>
    <p><label><input type="checkbox" class="skip-deleted"> 削除済み・非公開を除く</label></p>
    <p><label><input type="checkbox" class="skip-ai"> AI生成作品を除く</label></p>
    <button class="go" type="button">イラストをランダムに開く</button>
  </div>

  <div class="section" data-type="novel">
    <h2>小説 (Novel)</h2>
    <p>1〜<span class="max"></span> の中からランダムな小説IDへ移動します。</p>
    <p>
      <label>
        年齢制限：
        <select class="age-filter">
          <option value="all">全て表示</option>
          <option value="general">全年齢のみ</option>
          <option value="r18">R-18のみ</option>
        </select>
      </label>
    </p>
    <p><label><input type="checkbox" class="skip-deleted"> 削除済み・非公開を除く</label></p>
    <p><label><input type="checkbox" class="skip-ai"> AI生成作品を除く</label></p>
    <button class="go" type="button">小説をランダムに開く</button>
  </div>

  <p id="status"></p>

  <script>
    const MAX_ID = {
      illust: 152556704,
      novel: 27437698,
    };
    const API_URL = 'https://random-pixiv-api.vercel.app/api/batch';
    const SHARDS = 5;

    const statusEl = document.getElementById('status');

    function workUrl(type, id) {
      return type === 'novel'
        ? `https://www.pixiv.net/novel/show.php?id=${id}`
        : `https://www.pixiv.net/artworks/${id}`;
    }

    function showLink(url) {
      statusEl.innerHTML =
        `遷移先: <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function matches(item, filter) {
      if (filter.age === 'general' && item.x !== 0) return false;
      if (filter.age === 'r18' && item.x === 0) return false;
      if (filter.skipAi && item.ai) return false;
      return true;
    }

    // 確認済みの作品リストを、ばらばらの順番で取りに行き、条件に合う作品を探す
    async function findWork(type, filter) {
      const shards = Array.from({ length: SHARDS }, (_, i) => i).sort(() => Math.random() - 0.5);
      let apiFailed = 0;
      for (const [n, shard] of shards.entries()) {
        statusEl.textContent = `探しています…（${n + 1}/${SHARDS}）`;
        try {
          const res = await fetch(`${API_URL}?type=${type}&max=${MAX_ID[type]}&shard=${shard}`);
          if (!res.ok) { apiFailed++; continue; }
          const data = await res.json();
          const hits = data.items.filter((item) => matches(item, filter));
          if (hits.length > 0) return { id: pickRandom(hits).id };
        } catch {
          apiFailed++;
        }
      }
      return { id: null, apiFailed: apiFailed === SHARDS };
    }

    for (const section of document.querySelectorAll('.section')) {
      const type = section.dataset.type;
      const ageSelect = section.querySelector('.age-filter');
      const skipDeleted = section.querySelector('.skip-deleted');
      const skipAi = section.querySelector('.skip-ai');
      const button = section.querySelector('.go');
      section.querySelector('.max').textContent = MAX_ID[type];

      // 年齢制限やAI除外で絞る場合は、削除済みも必ず除かれるのでチェックを固定する
      const syncCheckbox = () => {
        const filtered = ageSelect.value !== 'all' || skipAi.checked;
        skipDeleted.disabled = filtered;
        if (filtered) skipDeleted.checked = true;
      };
      ageSelect.addEventListener('change', syncCheckbox);
      skipAi.addEventListener('change', syncCheckbox);

      button.addEventListener('click', async () => {
        const filter = { age: ageSelect.value, skipAi: skipAi.checked };

        // 何も絞らない場合は、今までどおり完全ランダム
        if (filter.age === 'all' && !filter.skipAi && !skipDeleted.checked) {
          const url = workUrl(type, Math.floor(Math.random() * MAX_ID[type]) + 1);
          showLink(url);
          window.open(url, '_blank', 'noopener,noreferrer');
          return;
        }

        // 確認に時間がかかるとポップアップがブロックされるので、先に空のタブを開いておく
        const tab = window.open('', '_blank');
        if (tab) {
          tab.opener = null;
          tab.document.title = '探しています…';
          tab.document.body.textContent = '条件に合う作品を探しています…';
        }
        button.disabled = true;
        try {
          const result = await findWork(type, filter);
          if (!result.id) {
            if (tab) tab.close();
            statusEl.textContent = result.apiFailed
              ? '作品情報を取得できませんでした。少し時間をおいてもう一度押してください。'
              : '条件に合う作品が見つかりませんでした。もう一度押してください。';
            return;
          }
          const url = workUrl(type, result.id);
          showLink(url);
          if (tab) tab.location.href = url;
        } finally {
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
