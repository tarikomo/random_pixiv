<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pixiv Artwork</title>
  <style>
    body {
      font-family: monospace, sans-serif;
      background: #eeeeee;
      color: #000000;
      margin: 2rem;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    .options {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .options label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }
    select {
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.3rem 0.5rem;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
      accent-color: #0000ff;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background: #0000ff;
      color: #ffffff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    a {
      color: #0000ee;
    }
    #status {
      margin-top: 0.8rem;
      min-height: 1.5rem;
    }
    .note {
      font-size: 0.8rem;
      color: #555555;
      margin-top: 0.3rem;
    }
    .retry-info {
      font-size: 0.85rem;
      color: #666666;
    }
    .warn {
      font-size: 0.85rem;
      color: #cc6600;
    }
  </style>
</head>
<body>
  <h1>Random Pixiv Artwork</h1>
  <p>1〜152520933 の中からランダムな作品IDへ移動します。</p>

  <div class="options">
    <label>
      <span>年齢制限：</span>
      <select id="ageFilter">
        <option value="all">全て表示</option>
        <option value="general">全年齢のみ</option>
        <option value="r18">R-18のみ</option>
      </select>
    </label>
    <label>
      <input type="checkbox" id="skipUnavailable" checked>
      削除済み・非公開を除く（自動リトライ）
    </label>
  </div>
  <p class="note">
    ※ フィルター機能はPixiv APIを使用しています。ログイン状態によってはR-18作品が表示されない場合があります。
  </p>

  <button id="go" type="button">ランダムに開く</button>
  <p id="status"></p>

  <script>
    const MAX_ID = 152520933;
    const MAX_RETRY = 20;
    const WORKER_URL = 'https://pixiv-proxy.tarikomo289.workers.dev';

    function getRandomId() {
      return Math.floor(Math.random() * MAX_ID) + 1;
    }

    function getArtworkUrl(id) {
      return `https://www.pixiv.net/artworks/${id}`;
    }

    /**
     * Workerを通じてPixiv API情報を取得する
     * 返り値: { ok, reason?, xRestrict? }
     *   ok=true  → 作品が存在し、xRestrict(0=全年齢, 1=R-18, 2=R-18G)が分かった
     *   ok=false, reason='not_found' → 作品が削除済み・非公開と確認できた
     *   ok=false, reason='api_error' → APIが利用できない（判定不能）
     */
    async function fetchArtworkInfo(id) {
      try {
        const res = await fetch(`${WORKER_URL}?id=${id}`, {
          signal: AbortSignal.timeout(8000)
        });
        const data = await res.json();
        return data;
      } catch {
        return { ok: false, reason: 'api_error' };
      }
    }

    async function findArtwork(ageFilter, skipUnavailable) {
      const btn = document.getElementById('go');
      const statusEl = document.getElementById('status');
      btn.disabled = true;

      // フィルターなし・チェックなしの場合は即開く
      if (ageFilter === 'all' && !skipUnavailable) {
        const id = getRandomId();
        const url = getArtworkUrl(id);
        statusEl.innerHTML =
          `遷移先: <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
        window.open(url, '_blank', 'noopener,noreferrer');
        btn.disabled = false;
        return;
      }

      statusEl.innerHTML = '<span class="retry-info">🔍 条件に合う作品を検索中...</span>';

      let apiFailCount = 0;

      for (let attempt = 1; attempt <= MAX_RETRY; attempt++) {
        const id = getRandomId();
        statusEl.innerHTML =
          `<span class="retry-info">🔍 試行 ${attempt}/${MAX_RETRY}：ID ${id} を確認中...</span>`;

        const info = await fetchArtworkInfo(id);

        // APIが応答できない場合（WorkerやPixivのエラー）
        if (!info.ok && info.reason === 'api_error') {
          apiFailCount++;

          if (ageFilter === 'all') {
            // 年齢フィルターなし・API不可なら「スキップしない」→そのまま開く
            const url = getArtworkUrl(id);
            statusEl.innerHTML =
              `遷移先: <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>` +
              `<br><span class="warn">⚠ API利用不可のため削除済み・非公開チェックをスキップしました</span>`;
            window.open(url, '_blank', 'noopener,noreferrer');
            btn.disabled = false;
            return;
          } else {
            // 年齢フィルターあり・API不可 → スキップ（判定できないため）
            continue;
          }
        }

        // 削除済み・非公開と確認できた場合のみスキップ
        if (skipUnavailable && !info.ok && info.reason === 'not_found') {
          continue;
        }

        // 年齢フィルターチェック（APIが成功した場合のみ適用）
        if (info.ok && ageFilter !== 'all') {
          if (ageFilter === 'general' && info.xRestrict !== 0) continue;
          if (ageFilter === 'r18' && info.xRestrict === 0) continue;
        }

        // 条件クリア → 開く
        const url = getArtworkUrl(id);
        const label = info.xRestrict === 1 ? ' [R-18]'
                    : info.xRestrict === 2 ? ' [R-18G]'
                    : info.ok ? ' [全年齢]' : '';
        statusEl.innerHTML =
          `遷移先: <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${label}`;
        window.open(url, '_blank', 'noopener,noreferrer');
        btn.disabled = false;
        return;
      }

      // MAX_RETRY回試しても見つからなかった
      const apiMsg = apiFailCount === MAX_RETRY
        ? '<br>（Pixiv APIに接続できませんでした。フィルターを「全て表示」にすると即開けます）'
        : '';
      statusEl.innerHTML =
        `<span style="color:#cc0000;">⚠ ${MAX_RETRY}回試しましたが条件に合う作品が見つかりませんでした。` +
        `フィルターを緩めるか、再度お試しください。${apiMsg}</span>`;
      btn.disabled = false;
    }

    document.getElementById('go').addEventListener('click', () => {
      const ageFilter = document.getElementById('ageFilter').value;
      const skipUnavailable = document.getElementById('skipUnavailable').checked;
      findArtwork(ageFilter, skipUnavailable);
    });
  </script>
</body>
</html>
