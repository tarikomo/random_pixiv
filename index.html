<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Pixiv</title>
  <style>
    body {
      font-family: monospace, sans-serif;
      background: #eeeeee;
      color: #000000;
      margin: 2rem;
    }
    .section {
      margin-top: 1.5rem;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      cursor: pointer;
    }
    button:hover {
      background: #0000ff;
      color: #ffffff;
    }
    a {
      color: #0000ee;
    }
  </style>
</head>
<body>
  <h1>Random Pixiv</h1>

  <div class="section">
    <h2>イラスト (Artwork)</h2>
    <p>1〜152556704 の中からランダムな作品IDへ移動します。</p>
    <button id="go-artwork" type="button">イラストをランダムに開く</button>
  </div>

  <div class="section">
    <h2>小説 (Novel)</h2>
    <p>1〜27437698 の中からランダムな小説IDへ移動します。</p>
    <button id="go-novel" type="button">小説をランダムに開く</button>
  </div>

  <p id="status"></p>

  <script>
    const MAX_ARTWORK_ID = 152556704;
    const MAX_NOVEL_ID = 27437698;

    function getRandomId(max) {
      return Math.floor(Math.random() * max) + 1;
    }

    function openRandomUrl(url) {
      document.getElementById('status').innerHTML =
        `遷移先: <a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    document.getElementById('go-artwork').addEventListener('click', () => {
      const id = getRandomId(MAX_ARTWORK_ID);
      openRandomUrl(`https://www.pixiv.net/artworks/${id}`);
    });

    document.getElementById('go-novel').addEventListener('click', () => {
      const id = getRandomId(MAX_NOVEL_ID);
      openRandomUrl(`https://www.pixiv.net/novel/show.php?id=${id}`);
    });
  </script>
</body>
</html>
